services:
  - type: web
    name: ultima-central
    runtime: static
    branch: main
    buildCommand: echo "Publishing ULTIMA Central static portal"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY

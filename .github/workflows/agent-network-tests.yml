name: ULTIMA agent network tests
on:
  push:
    paths:
      - "ultima_ai/**"
      - "tests/**"
      - ".github/workflows/agent-network-tests.yml"
  pull_request:
    paths:
      - "ultima_ai/**"
      - "tests/**"
      - ".github/workflows/agent-network-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

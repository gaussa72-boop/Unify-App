name: ULTIMA Update Matrix tests
on:
  push:
    paths:
      - "update_matrix.py"
      - "update_matrix_agents.json"
      - "tests/test_update_matrix.py"
      - "app.py"
      - ".github/workflows/update-matrix-tests.yml"
  pull_request:
    paths:
      - "update_matrix.py"
      - "update_matrix_agents.json"
      - "tests/test_update_matrix.py"
      - "app.py"
      - ".github/workflows/update-matrix-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "Flask>=3.1,<4"
      - run: python -m compileall -q update_matrix.py tests
      - run: python -m unittest discover -s tests -p "test_update_matrix.py" -v

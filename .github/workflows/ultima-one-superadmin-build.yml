name: ULTIMA ONE – Superadmin Builds

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/ultima-one-superadmin-build.yml"

permissions:
  contents: read

concurrency:
  group: ultima-one-superadmin-build
  cancel-in-progress: false

jobs:
  internal-builds:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install
      - name: Install Expo build CLI
        run: npm install --global eas-cli
      - name: Build private Android APK
        if: ${{ env.EXPO_TOKEN != '' }}
        working-directory: mobile
        run: eas build --platform android --profile superadmin --non-interactive
      - name: Build private iOS IPA
        if: ${{ env.EXPO_TOKEN != '' }}
        working-directory: mobile
        run: eas build --platform ios --profile superadmin --non-interactive
      - name: Explain skipped build
        if: ${{ env.EXPO_TOKEN == '' }}
        run: echo "Cloud builds skipped. Add EXPO_TOKEN as a repository Actions secret after securing the owner's Expo account."

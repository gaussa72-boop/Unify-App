name: ULTIMA ONE – Superadmin Builds

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/ultima-one-superadmin-build.yml"

permissions:
  contents: read

concurrency:
  group: ultima-one-superadmin-build
  cancel-in-progress: false

jobs:
  android-internal:
    if: ${{ secrets.EXPO_TOKEN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install
      - run: npm install --global eas-cli
      - name: Build private Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile superadmin --non-interactive

  ios-internal:
    if: ${{ secrets.EXPO_TOKEN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install
      - run: npm install --global eas-cli
      - name: Build private iOS IPA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile superadmin --non-interactive

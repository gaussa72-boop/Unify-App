# ULTIMA shared API wiring for existing AI services in Workspace One.
# No secret values are stored in Git. Existing services are adopted by exact name.
services:
  - type: web
    name: IONOS-KI
    runtime: python
    repo: https://github.com/gaussa72-boop/IONOS-KI
    branch: main
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - fromGroup: ALLES-OPENAI

  - type: web
    name: Ionos-7
    runtime: python
    repo: https://github.com/gaussa72-boop/Quantum.KI.Ultra.Pro.V2

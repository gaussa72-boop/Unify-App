# ULTIMA Central – managed AI web services
# Existing services are adopted by exact Render service name. No secret values are stored here.
services:
  - type: web
    name: ionos-ki-v2-1oki
    runtime: python
    repo: https://github.com/gaussa72-boop/IONOS-KI
    branch: main
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - fromGroup: ALLES-OPENAI

